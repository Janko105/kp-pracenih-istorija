<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <title>KP praćeni – istorija</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/>
    </svg>
    <div class="title">
      <h1>Pratim</h1>
      <span>istorija praćenih oglasa</span>
    </div>
    <button id="menu-btn" class="icon-btn" title="Još opcija" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"/></svg>
    </button>
    <div id="menu" class="menu" role="menu" hidden>
      <button id="open-full" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M10 5H5v14h14v-5"/></svg>
        Otvori u novom tabu
      </button>
      <hr>
      <button id="export" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Izvezi JSON
      </button>
      <button id="import" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>
        Uvezi JSON
      </button>
    </div>
    <input id="import-file" type="file" accept="application/json" hidden>
  </header>

  <nav class="tabs">
    <button data-tab="removed" class="active">Nestali <span class="count" id="cnt-removed">0</span></button>
    <button data-tab="active">Aktivni <span class="count" id="cnt-active">0</span></button>
  </nav>

  <p id="scan-info" class="notice"></p>

  <main>
    <ul id="list"></ul>
    <div id="empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <p id="empty-text"></p>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
